<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#412a47">
<title>Battle in Space</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="hud2d"></canvas>

<!-- PANTALLA DE TÍTULO -->
<section id="titulo" class="screen visible">
  <img src="img/titulo.jpg" alt="battle in space">
  <div class="tocar">TOCA PARA EMPEZAR</div>
</section>

<!-- MENÚ -->
<section id="menu" class="screen">
  <div class="retrato-caja">
    <img class="retrato" id="retrato" src="img/pilotos/victor.png" alt="">
    <div class="retrato-info"><b id="pilotoNombre">Víctor</b><br><small>Especial: <span id="pilotoEspecial">Tornado</span></small></div>
  </div>
  <div class="menu-col">
    <h1 class="logo">battle in space</h1>
    <button class="bar jugar" id="btnJugar"><span>JUGAR</span></button>
    <div class="bar opt piloto"><span><b class="flecha" data-opt="piloto" data-d="-1">&lt;</b> PILOTO <b class="flecha" data-opt="piloto" data-d="1">&gt;</b></span></div>
    <div class="fila">
      <div class="bar opt"><span><b class="flecha" data-opt="vidas" data-d="-1">&lt;</b> VIDAS <i id="vVidas">5</i> <b class="flecha" data-opt="vidas" data-d="1">&gt;</b></span></div>
      <div class="bar opt"><span><b class="flecha" data-opt="rivales" data-d="-1">&lt;</b> RIVALES <i id="vRivales">10</i> <b class="flecha" data-opt="rivales" data-d="1">&gt;</b></span></div>
    </div>
    <div class="fila">
      <button class="bar opt editar" id="btnEditar"><span>EDITAR NAVE</span></button>
      <button class="bar opt tiendaBtn" id="btnTienda"><span>TIENDA <i id="gemasMenu">💎 0</i></span></button>
    </div>
    <button class="bar opt actualizar" id="btnActualizar"><span id="txtActualizar">BUSCAR ACTUALIZACIONES</span></button>
    <button class="bar salir" id="btnSalir"><span>SALIR DEL JUEGO</span></button>
  </div>
  <div id="version"></div>
</section>

<!-- HUD DE LA PARTIDA -->
<section id="hud" class="screen">
  <div class="vida"><div class="vida-fill" id="vidaFill"></div><span>VIDA</span></div>
  <div class="info">
    <div id="vivas">11/11<br><small>PERSONAS VIVAS</small></div>
    <div id="derribos">DERRIBOS 0</div>
    <div id="corazones"></div>
    <div id="gemasHud">💎 0</div>
  </div>
  <button class="cerrar" id="btnCerrar">✕</button>
  <div id="feed"></div>
  <div id="mensaje"></div>

  <div id="joyZona"><div id="joy"><div class="arrows">‹ ›</div><div id="knob"></div></div></div>

  <button id="btnEspecial" class="redondo especial">‹ϟ›</button>
  <button id="btnEscudo" class="redondo especial">🛡</button>
  <div id="municion"></div>
  <div id="botones">
    <button id="btnFuego" class="redondo grande">✦<i></i><i></i></button>
    <div id="turboBar"><div id="turboFill"></div></div>
    <div class="chicos">
      <button id="btnTurbo" class="redondo">✚</button>
      <button id="btnGiro" class="redondo">⟲</button>
    </div>
  </div>
</section>

<!-- EDITAR NAVE -->
<section id="editor" class="screen">
  <button class="volver" id="btnVolverEditor">← VOLVER</button>
  <div class="titulo-pantalla">EDITAR NAVE</div>
  <div class="linea-azul"></div>
  <div class="panel-editor">
    <div id="ranuras"></div>
    <button class="bar opt tiendaBtn" id="btnEditorTienda"><span>IR A LA TIENDA</span></button>
  </div>
</section>

<!-- TIENDA -->
<section id="tienda" class="screen">
  <button class="volver" id="btnVolverTienda">← VOLVER</button>
  <div class="titulo-pantalla claro">TIENDA <span id="gemasTienda">💎 0</span></div>
  <button class="volver derecha" id="btnTiendaEditor">EDITAR NAVE →</button>
  <div id="productos"></div>
  <div id="avisoTienda"></div>
</section>

<!-- FIN DE PARTIDA -->
<section id="fin" class="screen">
  <div class="fin-caja">
    <h2 id="finTitulo">¡GANASTE!</h2>
    <p id="finTexto"></p>
    <button class="bar jugar" id="btnOtra"><span>OTRA VEZ</span></button>
    <button class="bar salir" id="btnMenu"><span>MENÚ</span></button>
  </div>
</section>

<div id="girar">Gira el teléfono ↻</div>

<div id="diag" style="display:none;position:fixed;inset:0;z-index:999;background:#300;color:#fff;font:14px monospace;padding:12px;overflow:auto;white-space:pre-wrap"></div>
<script>
  // Diagnóstico: si algo falla, lo muestra en pantalla
  (function () {
    var lineas = [];
    function info() {
      var gl2 = false, gl1 = false;
      try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
      try { gl1 = !!document.createElement('canvas').getContext('webgl'); } catch (e) {}
      return 'WebGL2: ' + gl2 + '  WebGL1: ' + gl1 + '\n' + navigator.userAgent;
    }
    function mostrar(msg) {
      lineas.push(msg);
      var d = document.getElementById('diag');
      d.style.display = 'block';
      d.textContent = 'ERROR (saca una captura y mándala):\n\n' + lineas.join('\n') + '\n\n' + info() + '\n\n(toca para cerrar)';
      d.onclick = function () { d.style.display = 'none'; };
    }
    window.addEventListener('error', function (e) {
      mostrar((e.message || 'Error al cargar ' + ((e.target && (e.target.src || e.target.href)) || '?')) +
        (e.filename ? '\n  en ' + e.filename + ':' + e.lineno : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) { mostrar('Promesa: ' + (e.reason && (e.reason.stack || e.reason))); });
    setTimeout(function () { if (!window.__juegoListo) mostrar('El juego no terminó de cargar.'); }, 6000);
  })();
</script>
<script type="module" src="game.js"></script>
</body>
</html>
